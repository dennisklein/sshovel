# SPDX-License-Identifier: GPL-3.0-or-later
#
# Licensing for files that can't carry an SPDX header (ARCHITECTURE §12 item 2).
version = 1

# Documentation and the Claude Design handoff (HTML exports, thumbnails,
# SVG icons, generated Kotlin/XML samples).
[[annotations]]
path = ["CLAUDE.md", "docs/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Dennis Klein"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Go module files are rewritten by the go command; JSON has no comments.
[[annotations]]
path = ["core/go.mod", "core/go.sum", "test-env/*.json", "app/src/test/resources/*.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Dennis Klein"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The Gradle wrapper, as generated by Gradle.
[[annotations]]
path = ["gradlew", "gradlew.bat", "gradle/wrapper/gradle-wrapper.jar", "gradle/wrapper/gradle-wrapper.properties"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2015-2021 the original authors (Gradle)"
SPDX-License-Identifier = "Apache-2.0"

# Roboto Mono (docs/design handoff §1.3), bundled for machine values.
[[annotations]]
path = ["app/src/main/res/font/roboto_mono_*.ttf"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2015 The Roboto Mono Project Authors (https://github.com/googlefonts/robotomono)"
SPDX-License-Identifier = "OFL-1.1"

# F-Droid metadata (fastlane layout): plain text that can't carry a header.
[[annotations]]
path = ["fastlane/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Dennis Klein"
SPDX-License-Identifier = "GPL-3.0-or-later"
