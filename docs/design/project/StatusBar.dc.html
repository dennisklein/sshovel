<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="height:40px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 20px 0 28px;font:500 14px/20px Roboto, sans-serif;color:var(--onSurface);position:relative;z-index:3">
  <span>9:41</span>
  <span style="display:flex;align-items:center;gap:4px">
    <sc-if value="{{ vpn }}" hint-placeholder-val="{{ false }}"><span class="material-symbols-outlined" style="font-size:16px;font-variation-settings:'FILL' 1">vpn_key</span></sc-if>
    <sc-if value="{{ mobile }}" hint-placeholder-val="{{ false }}"><span style="font-size:11px;font-weight:600">5G</span></sc-if>
    <span class="material-symbols-outlined" style="font-size:17px;font-variation-settings:'FILL' 1">{{ net }}</span>
    <span class="material-symbols-outlined" style="font-size:17px;font-variation-settings:'FILL' 1">battery_5_bar</span>
  </span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:412,&quot;height&quot;:40},&quot;vpn&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;mobile&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const mobile = !!this.props.mobile;
    return { vpn: !!this.props.vpn, mobile, net: mobile ? 'signal_cellular_4_bar' : 'signal_wifi_4_bar' };
  }
}
</script>
</body>
</html>
