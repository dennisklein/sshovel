#
# nginx's default site, plus /files/ throttled so that a download is still running when the
# M8 acceptance run switches networks (IMPLEMENTATION_PLAN §7). m8.sh writes files/big.bin.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location /files/ { limit_rate 128k; }
}
